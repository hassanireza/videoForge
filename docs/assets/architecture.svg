<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="360" fill="#0a0e14" rx="16"/>

  <!-- Renderer column -->
  <rect x="30" y="30" width="260" height="300" rx="14" fill="#111726" stroke="#22283a"/>
  <text x="160" y="60" fill="#8a94a6" font-size="12" letter-spacing="2" text-anchor="middle">RENDERER (REACT)</text>

  <rect x="55" y="80" width="210" height="46" rx="8" fill="#171d2c" stroke="#232a3d"/>
  <text x="160" y="108" fill="#e7ebf3" font-size="13" text-anchor="middle">ClipBin</text>

  <rect x="55" y="136" width="210" height="46" rx="8" fill="#171d2c" stroke="#232a3d"/>
  <text x="160" y="164" fill="#e7ebf3" font-size="13" text-anchor="middle">OperationPanel</text>

  <rect x="55" y="192" width="210" height="46" rx="8" fill="#171d2c" stroke="#232a3d"/>
  <text x="160" y="220" fill="#e7ebf3" font-size="13" text-anchor="middle">JobQueue</text>

  <rect x="55" y="252" width="210" height="56" rx="8" fill="#0e2038" stroke="#1c3a5c"/>
  <text x="160" y="275" fill="#7db8ff" font-size="12" text-anchor="middle">ClipLibrary / JobQueueStore</text>
  <text x="160" y="293" fill="#5c6478" font-size="10.5" text-anchor="middle">observable state, one source of truth</text>

  <!-- Bridge -->
  <rect x="330" y="140" width="240" height="80" rx="14" fill="#0e2038" stroke="#3b9dff"/>
  <text x="450" y="170" fill="#3b9dff" font-size="13" font-weight="bold" text-anchor="middle">window.api</text>
  <text x="450" y="190" fill="#8ab6e8" font-size="11" text-anchor="middle">preload.ts — contextBridge</text>
  <text x="450" y="206" fill="#5c6478" font-size="10" text-anchor="middle">the ONLY surface the UI can call</text>

  <path d="M290 180 H330" stroke="#3b9dff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M570 180 H610" stroke="#3b9dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Main process column -->
  <rect x="610" y="30" width="260" height="300" rx="14" fill="#111726" stroke="#22283a"/>
  <text x="740" y="60" fill="#8a94a6" font-size="12" letter-spacing="2" text-anchor="middle">MAIN PROCESS (NODE)</text>

  <rect x="635" y="80" width="210" height="46" rx="8" fill="#171d2c" stroke="#232a3d"/>
  <text x="740" y="108" fill="#e7ebf3" font-size="13" text-anchor="middle">JobQueueManager</text>

  <rect x="635" y="136" width="210" height="46" rx="8" fill="#171d2c" stroke="#232a3d"/>
  <text x="740" y="164" fill="#e7ebf3" font-size="13" text-anchor="middle">OutputResolver</text>

  <rect x="635" y="192" width="210" height="46" rx="8" fill="#171d2c" stroke="#232a3d"/>
  <text x="740" y="220" fill="#e7ebf3" font-size="13" text-anchor="middle">FfmpegJob subclasses</text>

  <rect x="635" y="252" width="210" height="56" rx="8" fill="#251506" stroke="#5c3a12"/>
  <text x="740" y="275" fill="#e8a33d" font-size="12" font-weight="bold" text-anchor="middle">ffmpeg / ffprobe</text>
  <text x="740" y="293" fill="#5c6478" font-size="10.5" text-anchor="middle">spawned as a child process</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#3b9dff"/>
    </marker>
  </defs>
</svg>
