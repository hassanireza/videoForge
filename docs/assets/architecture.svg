<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="'Jost', Arial, sans-serif">
  <rect width="900" height="360" fill="#08090b"/>

  <!-- Renderer column -->
  <rect x="30" y="30" width="260" height="300" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="160" y="60" fill="#7f8589" font-size="11" letter-spacing="3" text-anchor="middle">RENDERER (REACT)</text>

  <rect x="55" y="80" width="210" height="46" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="160" y="108" fill="#e6e3da" font-size="13" text-anchor="middle">ClipBin</text>

  <rect x="55" y="136" width="210" height="46" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="160" y="164" fill="#e6e3da" font-size="13" text-anchor="middle">OperationPanel</text>

  <rect x="55" y="192" width="210" height="46" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="160" y="220" fill="#e6e3da" font-size="13" text-anchor="middle">JobQueue</text>

  <rect x="55" y="252" width="210" height="56" fill="rgba(124,136,145,0.06)" stroke="#7c8891" stroke-width="1"/>
  <text x="160" y="275" fill="#c9cfd2" font-size="11.5" text-anchor="middle">ClipLibrary / JobQueueStore</text>
  <text x="160" y="293" fill="#7f8589" font-size="10" text-anchor="middle">observable state, one source of truth</text>

  <!-- Bridge -->
  <rect x="330" y="140" width="240" height="80" fill="rgba(124,136,145,0.06)" stroke="#7c8891" stroke-width="1"/>
  <text x="450" y="170" fill="#c9cfd2" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">window.api</text>
  <text x="450" y="190" fill="#9aa3a8" font-size="11" text-anchor="middle">preload.ts &#8212; contextBridge</text>
  <text x="450" y="206" fill="#7f8589" font-size="10" text-anchor="middle">the ONLY surface the UI can call</text>

  <path d="M290 180 H330" stroke="#7c8891" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M570 180 H610" stroke="#7c8891" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Main process column -->
  <rect x="610" y="30" width="260" height="300" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="740" y="60" fill="#7f8589" font-size="11" letter-spacing="3" text-anchor="middle">MAIN PROCESS (NODE)</text>

  <rect x="635" y="80" width="210" height="46" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="740" y="108" fill="#e6e3da" font-size="13" text-anchor="middle">JobQueueManager</text>

  <rect x="635" y="136" width="210" height="46" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="740" y="164" fill="#e6e3da" font-size="13" text-anchor="middle">OutputResolver</text>

  <rect x="635" y="192" width="210" height="46" fill="none" stroke="#1b1e22" stroke-width="1"/>
  <text x="740" y="220" fill="#e6e3da" font-size="13" text-anchor="middle">FfmpegJob subclasses</text>

  <rect x="635" y="252" width="210" height="56" fill="rgba(168,100,90,0.08)" stroke="#a8645a" stroke-width="1"/>
  <text x="740" y="275" fill="#c98d81" font-size="12" font-weight="600" text-anchor="middle">ffmpeg / ffprobe</text>
  <text x="740" y="293" fill="#7f8589" font-size="10" text-anchor="middle">spawned as a child process</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7c8891"/>
    </marker>
  </defs>
</svg>
